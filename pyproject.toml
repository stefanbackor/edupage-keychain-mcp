[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "edupage-keyring-mcp"
version = "0.1.0"
description = "EduPage MCP server for Claude and other MCP clients: timetables, grades, homework, messages and more, with the session kept in the macOS Keychain and no stored password."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Stefan Backor" }]
keywords = ["mcp", "edupage", "school", "timetable", "grades", "homework", "keychain", "keyring", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
# Exact pins on purpose: this is an application that handles a school login.
# Upgrades go through a reviewed change to these pins and uv.lock.
dependencies = [
    "mcp==2.3.0",
    "edupage-api==0.13.3",
    "requests==2.32.5",
    "keyring==25.7.0",
    "playwright==1.64.1",
]

[project.urls]
Homepage = "https://github.com/stefanbackor/edupage-keyring-mcp"
Repository = "https://github.com/stefanbackor/edupage-keyring-mcp"
Issues = "https://github.com/stefanbackor/edupage-keyring-mcp/issues"

[project.scripts]
edupage-keyring-mcp = "edupage_keyring_mcp.cli:main"

[dependency-groups]
dev = ["pytest==8.3.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/edupage_keyring_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "SECURITY.md", "server.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
