name: Release

# Publishing a GitHub Release (tag vX.Y.Z, notes = changelog) builds the
# package and the Claude Desktop extension (.mcpb), publishes the package to
# PyPI and the official MCP Registry, and attaches the built files to the
# release. Releases are made with the /release skill.
# One-time setup:
#   1. PyPI → Your account → Publishing → add a pending trusted publisher:
#      project edupage-keyring-mcp, owner stefanbackor, repo edupage-keyring-mcp,
#      workflow release.yml, environment pypi.
#   2. GitHub repo → Settings → Environments → create "pypi".
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          init=$(grep -m1 '__version__' src/edupage_keyring_mcp/__init__.py | cut -d"'" -f2)
          srv=$(jq -r .version server.json)
          pkg=$(jq -r '.packages[0].version' server.json)
          mcpb=$(jq -r .version manifest.json)
          echo "tag=$tag pyproject=$py init=$init server=$srv package=$pkg mcpb=$mcpb"
          test "$tag" = "$py" && test "$tag" = "$init" && test "$tag" = "$srv" && test "$tag" = "$pkg" \
            && test "$tag" = "$mcpb"
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # Packed outside dist/: everything in dist/ goes to PyPI. The file name has no
      # version, so releases/latest/download/edupage-keyring-mcp.mcpb always works.
      - name: Pack the Claude Desktop extension
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack . bundle/edupage-keyring-mcp.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing, no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release-files:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the built files to the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle/
      - name: Attach the built files to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* bundle/*.mcpb --repo "$GITHUB_REPOSITORY" --clobber

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC login for the io.github.stefanbackor namespace
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Wait for the PyPI release to be visible
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/edupage-keyring-mcp/$version/json" >/dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
